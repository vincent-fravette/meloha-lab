<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Hero Overlay</title>
</head>

<body>
    <main>
        <section class="hero">
            <img src="https://images.unsplash.com/photo-1653478986501-61b22a3362ac?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Bureau de travail informatique" class="hero-img">
            <div class="hero-overlay"></div>

            <div class="hero-content">
                <h1 class="animate-fade-up">Sublimez votre présence en ligne</h1>
                <p class="animate-fade-up delay-1">Créez des interfaces modernes, épurées et parfaitement accessibles.
                </p>
                <div class="animate-fade-up delay-2">
                    <a href="#" class="hero-btn">Découvrir</a>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
